<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello World</title>
    <style>
      :root {
        --bg-1: #0f172a;
        --bg-2: #1e293b;
        --card: rgba(15, 23, 42, 0.7);
        --text: #e2e8f0;
        --muted: #cbd5e1;
        --accent: #7c3aed;
        --accent-2: #22d3ee;
        --glow: rgba(124, 58, 237, 0.45);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background:
          radial-gradient(circle at top left, rgba(34, 211, 238, 0.18), transparent 30%),
          radial-gradient(circle at bottom right, rgba(124, 58, 237, 0.2), transparent 35%),
          linear-gradient(135deg, var(--bg-1), var(--bg-2));
        color: var(--text);
      }

      .card {
        position: relative;
        width: min(90vw, 620px);
        padding: 3rem 2.5rem;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 24px;
        background: rgba(15, 23, 42, 0.65);
        backdrop-filter: blur(12px);
        box-shadow: 0 25px 80px rgba(15, 23, 42, 0.5), 0 0 40px var(--glow);
        overflow: hidden;
      }

      .card::before,
      .card::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        filter: blur(20px);
        opacity: 0.8;
      }

      .card::before {
        width: 220px;
        height: 220px;
        background: rgba(34, 211, 238, 0.2);
        right: -60px;
        top: -60px;
      }

      .card::after {
        width: 180px;
        height: 180px;
        background: rgba(124, 58, 237, 0.22);
        left: -40px;
        bottom: -60px;
      }

      .content {
        position: relative;
        z-index: 1;
        text-align: center;
      }

      .badge {
        display: inline-block;
        padding: 0.5rem 0.9rem;
        border-radius: 999px;
        font-size: 0.7rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        background: rgba(124, 58, 237, 0.15);
        color: #d8b4fe;
        border: 1px solid rgba(196, 181, 253, 0.3);
        margin-bottom: 1.25rem;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.5rem, 6vw, 5rem);
        line-height: 1;
        letter-spacing: -0.06em;
        background: linear-gradient(135deg, #f8fafc, #a5f3fc 35%, #c4b5fd 70%, #f9a8d4);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      p {
        margin: 1.2rem auto 0;
        max-width: 32rem;
        font-size: 1.05rem;
        line-height: 1.7;
        color: var(--muted);
      }

      .button-row {
        margin-top: 2rem;
        display: flex;
        justify-content: center;
        gap: 1rem;
        flex-wrap: wrap;
      }

      .button {
        appearance: none;
        border: none;
        border-radius: 999px;
        padding: 0.9rem 1.5rem;
        font-size: 0.98rem;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
      }

      .button:hover {
        transform: translateY(-2px);
      }

      .button.primary {
        background: linear-gradient(135deg, var(--accent), #8b5cf6);
        color: white;
        box-shadow: 0 15px 30px rgba(124, 58, 237, 0.4);
      }

      .button.secondary {
        background: rgba(148, 163, 184, 0.08);
        color: var(--text);
        border: 1px solid rgba(148, 163, 184, 0.2);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="content">
        <div class="badge">Welcome</div>
        <h1>Hello World</h1>
        <p>
          Your first web page is live, sleek, and ready to impress.
        </p>
        <div class="button-row">
          <button class="button primary">Get Started</button>
          <button class="button secondary">Learn More</button>
        </div>
      </div>
    </div>
  </body>
</html>
