<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery | VL Tech</title>
    <style>
      :root {
        --bg-1: #0f172a;
        --bg-2: #1e293b;
        --text: #e2e8f0;
        --muted: #cbd5e1;
        --accent: #22d3ee;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background:
          radial-gradient(circle at top left, rgba(34, 211, 238, 0.16), transparent 30%),
          radial-gradient(circle at bottom right, rgba(124, 58, 237, 0.18), transparent 35%),
          linear-gradient(135deg, var(--bg-1), var(--bg-2));
        color: var(--text);
        padding: 6.5rem 6vw 3rem;
      }

      .topbar {
        position: fixed;
        z-index: 10;
        top: 0;
        left: 0;
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.35rem 6vw;
        background: rgba(15, 23, 42, 0.82);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }

      .brand { display: inline-flex; align-items: center; flex: 0 0 auto; }
      .brand img { display: block; width: 84px; height: 50px; object-fit: contain; }
      .nav { display: flex; gap: 1rem; flex-wrap: wrap; }
      .nav a { color: var(--muted); text-decoration: none; font-weight: 600; }
      .nav a:hover, .nav a.active { color: #fff; }

      main { width: min(1100px, 100%); margin: 0 auto; }
      .intro { margin-bottom: 1.75rem; text-align: center; }
      .eyebrow {
        display: inline-block;
        padding: 0.45rem 0.8rem;
        border: 1px solid rgba(34, 211, 238, 0.35);
        border-radius: 999px;
        color: #a5f3fc;
        background: rgba(34, 211, 238, 0.1);
        font-size: 0.75rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0.8rem 0 0;
        font-size: clamp(2.3rem, 5vw, 4rem);
        line-height: 1.1;
        background: linear-gradient(135deg, #fff, #a5f3fc 60%, #c4b5fd);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .intro p { margin: 0.8rem auto 0; color: var(--muted); line-height: 1.7; }

      .gallery-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 1.25rem;
      }
      figure {
        margin: 0;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 20px;
        background: rgba(15, 23, 42, 0.72);
        box-shadow: 0 20px 55px rgba(0, 0, 0, 0.28);
      }
      figure img {
        display: block;
        width: 100%;
        aspect-ratio: 4 / 3;
        object-fit: cover;
        background: #1e293b;
      }
      figcaption { padding: 0.9rem 1rem; color: var(--muted); }

      @media (max-width: 620px) {
        body { padding: 5.8rem 4vw 2rem; }
        .topbar { padding: 0.25rem 4vw; }
        .brand img { width: 70px; height: 44px; }
        .nav { gap: 0.55rem; font-size: 0.9rem; }
        .gallery-grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <nav class="topbar" aria-label="Main navigation">
      <a class="brand" href="index.html" aria-label="VL Tech home"><img src="logo.svg" alt="VL Tech" /></a>
      <div class="nav">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="gallery.html" class="active" aria-current="page">Gallery</a>
        <a href="contact.html">Contact</a>
      </div>
    </nav>

    <main>
      <header class="intro">
        <span class="eyebrow">Moments &amp; Work</span>
        <h1>Gallery</h1>
        <p>Photos from our learning and collaboration sessions.</p>
      </header>
      <section class="gallery-grid" aria-label="Photo gallery">
        <figure>
          <img src="WhatsApp%20Image%202026-10-14%20at%2011.16%20%20%20v.01.jpeg" alt="A group collaborating around a table with laptops" />
          <figcaption>Working together and sharing ideas.</figcaption>
        </figure>
        <figure>
          <img src="WhatsApp%20Image%202026-10-14%20at%2011.16.01.jpeg" alt="Learners discussing work around a table" />
          <figcaption>Learning through teamwork and practice.</figcaption>
        </figure>
      </section>
    </main>
  </body>
</html>
